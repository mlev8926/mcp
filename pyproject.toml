[project]
name = "nexus-mcp"
version = "0.1.0"
description = "NEXUS MCP server for architecture governance and project intelligence"
requires-python = ">=3.11"
dependencies = ["mcp[cli]>=2,<3", "watchdog>=6,<7"]

[project.scripts]
nexus-mcp = "nexus_mcp.cli:main"

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
